name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Core checks: compile, test, clippy, rustfmt ──────────────────────────
  check-test:
    name: check + test + clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri Linux build prerequisites (webkit2gtk etc.)
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: cargo test (workspace)
        run: cargo test --workspace

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: rustfmt check
        run: cargo fmt --all --check

  # ── Dependency vulnerability audit (RustSec advisory DB) ────────────────
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  # ── Miri: UB sanitizer over the crate's pure-logic tests ────────────────
  # Windows cargo-miri cannot handle rustc argfiles (long CLI), so this runs
  # on Linux; local Windows users can still run the same tests via CI.
  miri:
    name: miri UB checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2

      - name: Miri setup
        run: cargo miri setup

      - name: Run Miri pure-logic tests
        run: cargo +nightly miri test --lib miri_safe

  # ── Loom: exhaustive interleaving checks of concurrency patterns ────────
  # Runs in a standalone crate so --cfg loom never leaks into the tauri
  # dependency graph (tokio-tungstenite breaks under a workspace-wide cfg).
  loom:
    name: loom model checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Loom model check
        run: RUSTFLAGS="--cfg loom" cargo +nightly test -p loom-tests

  # ── Frontend: type-check + production build ─────────────────────────────
  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Vite production build
        run: npx vite build
