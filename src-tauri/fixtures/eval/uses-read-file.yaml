id: uses-read-file
name: Calls read_file then summarizes
description: >
  The agent issues one read_file tool call (captured at the ToolCall event,
  regardless of whether execution succeeds) and then produces a final answer.
  Verifies tool orchestration and completion.
prompt: Read README.md and tell me its first line.
turns:
  - tool_calls:
      content: Let me read that file.
      calls:
        - name: read_file
          arguments:
            path: README.md
  - text:
      content: "The first line is: # NeoCoder"
agent:
  max_iterations: 6
  tool_names:
    - read_file
    - glob
    - grep
expect:
  must_finish: true
  tools_called:
    - read_file
  forbidden_tools:
    - run_terminal_command
  final_text_contains:
    - "NeoCoder"
