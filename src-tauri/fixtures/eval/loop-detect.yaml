id: loop-detect
name: Repeated identical reads trip loop detection
description: >
  Twelve identical read_file calls with no progress. The loop detector should
  inject a warning ("Loop detected") and then hard-stop the runaway pattern,
  returning an error. Verifies the non-progress guardrail fires instead of the
  agent burning its whole budget on the same failing call.
prompt: Keep reading the same missing file.
turns:
  - tool_calls:
      calls:
        - name: read_file
          arguments:
            path: no-such-file-eval.txt
  - tool_calls:
      calls:
        - name: read_file
          arguments:
            path: no-such-file-eval.txt
  - tool_calls:
      calls:
        - name: read_file
          arguments:
            path: no-such-file-eval.txt
  - tool_calls:
      calls:
        - name: read_file
          arguments:
            path: no-such-file-eval.txt
  - tool_calls:
      calls:
        - name: read_file
          arguments:
            path: no-such-file-eval.txt
  - tool_calls:
      calls:
        - name: read_file
          arguments:
            path: no-such-file-eval.txt
  - tool_calls:
      calls:
        - name: read_file
          arguments:
            path: no-such-file-eval.txt
  - tool_calls:
      calls:
        - name: read_file
          arguments:
            path: no-such-file-eval.txt
  - tool_calls:
      calls:
        - name: read_file
          arguments:
            path: no-such-file-eval.txt
  - tool_calls:
      calls:
        - name: read_file
          arguments:
            path: no-such-file-eval.txt
  - tool_calls:
      calls:
        - name: read_file
          arguments:
            path: no-such-file-eval.txt
  - tool_calls:
      calls:
        - name: read_file
          arguments:
            path: no-such-file-eval.txt
agent:
  max_iterations: 20
  tool_names:
    - read_file
    - glob
expect:
  must_finish: false
  must_error: true
  expect_log_contains:
    - "Loop detected"
