id: context-compaction
name: Long context triggers compaction (ContextTrimmed)
description: >
  A read-heavy run with a deliberately tiny context budget (max_context_tokens
  override). Once the message list grows past the compaction floor (>=8 msgs) and
  its token estimate crosses 80% of the forced budget, the agent trims/summarizes
  context and emits the `ContextTrimmed` event (both the proactive task-progress
  path and the emergency path emit this same event, so the assertion holds
  whichever fires). This is the riskiest fixture: it depends on threshold +
  message-accumulation timing, so it uses distinct read-only tools with distinct
  arguments to grow history without tripping loop detection.
prompt: Explore the project structure across several files.
turns:
  - tool_calls:
      content: Reading the manifest.
      calls:
        - name: read_file
          arguments:
            path: Cargo.toml
  - tool_calls:
      content: Listing Rust sources.
      calls:
        - name: glob
          arguments:
            pattern: "src/**/*.rs"
  - tool_calls:
      content: Grepping for todos.
      calls:
        - name: grep
          arguments:
            pattern: "TODO"
  - tool_calls:
      content: Listing the root directory.
      calls:
        - name: list_directory
          arguments:
            path: .
  - tool_calls:
      content: Reading the readme.
      calls:
        - name: read_file
          arguments:
            path: README.md
  - tool_calls:
      content: Getting symbols.
      calls:
        - name: get_symbols
          arguments:
            path: src/main.rs
  - text:
      content: "Exploration complete. I reviewed the layout."
agent:
  max_context_tokens: 200
  max_iterations: 12
  tool_names:
    - read_file
    - glob
    - grep
    - list_directory
    - get_symbols
expect:
  must_finish: true
  expect_events_contains:
    - ContextTrimmed
  expect_log_contains:
    - "summarized"
